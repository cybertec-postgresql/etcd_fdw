[package]
name = "etcd_fdw"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15", "supabase-wrappers/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "supabase-wrappers/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "supabase-wrappers/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18", "supabase-wrappers/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19", "supabase-wrappers/pg19"]
pg_test = []

[dependencies]
etcd-client = { version = "0.16", features = ["tls"] }
futures = "0.3.31"
pgrx = {version="=0.20.1"}
supabase-wrappers = { git = "https://github.com/pgsty/wrappers.git", rev = "e4a75cc3d2fee549ead3032c98a0cf764cd63c02", default-features = false }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
testcontainers = { version = "0.25.0", features = ["blocking"] }
serde = { version = "1.0.226", features = ["derive"] }

[dev-dependencies]
pgrx-tests = "=0.20.1"
testcontainers = { version = "0.25.0", features = ["blocking"] }
serde = { version = "1.0.226", features = ["derive"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
