[package]
name = "etcd_client_sync"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.9", features = ["tls", "native-certs", "json"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["full"] }
